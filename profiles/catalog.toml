version = "1"

[profile.desktop]
status = "planned"
summary = "General-purpose desktop, development, administration, and accessibility"
network_default = "user-controlled"

[profile.security-observe]
status = "prototype"
summary = "Read-only local posture and evidence collection"
network_default = "disabled-unless-scoped"

[profile.security-lab]
status = "planned"
summary = "Authorized lab workflows through disposable isolation"
network_default = "isolated-and-scoped"

[profile.forensics]
status = "planned"
summary = "Read-only evidence and timeline workflows"
network_default = "disabled-by-default"

[profile.wireless-hardware]
status = "planned"
summary = "Hardware, wireless, Bluetooth, SDR, and firmware review"
network_default = "explicit-scope"

[profile.cloud-code]
status = "prototype"
summary = "SAST, dependency, SBOM, IaC, and container review"
network_default = "local-only"

[profile.learning]
status = "planned"
summary = "Isolated training labs and guided exercises"
network_default = "isolated-only"

[capability_metadata]
required = ["source_url", "license", "version", "checksum", "architectures", "privileges", "network_behavior", "tests", "uninstall_path"]

[capability.rustscan]
status = "catalogued"
lifecycle = "catalogued"
package = "rustscan"
source_url = "https://github.com/bee-san/RustScan"
license = "GPL-3.0-only"
version = "2.4.1"
checksum_amd64 = "f3a4365d939e3b81f25ba8c37852ce9ac9e938c3cc882c5b3e6fff6152c740be"
checksum_arm64 = "4f49103e2dfc9e9709a36da2cd61f1f81613f8d0a203307f750439fc3ce39eae"
architectures = ["amd64", "arm64"]
privileges = ["user-tool"]
network_behavior = "active-network-connections; explicit-authorized-scope-required; no-automatic-nmap-handoff"
tests = ["official-release-asset", "artifact-sha256", "dry-run-policy", "scope-check", "operator-confirmation", "sandbox-launch"]
uninstall_path = "rm /usr/local/bin/rustscan and remove the manifest record"
profile = "security-lab"
