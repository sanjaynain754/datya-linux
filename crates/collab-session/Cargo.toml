[package]
name = "datya-collab-session"
version = "0.1.0"
edition = "2021"
description = "Four-participant, auditable collaboration session core for Datya Linux"
license = "Apache-2.0"

[lib]
name = "datya_collab_session"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize = "=1.8.1"
